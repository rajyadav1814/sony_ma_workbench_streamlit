[project]
name = "sony-ma-workbench"
requires-python = "~=3.11.0"
version = "0.0.1"
description = "Sony Music M&A catalogue valuation workbench (Streamlit + PostgreSQL)"
dependencies = [
    "streamlit>=1.42",
    "Authlib>=1.3.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[tool.uv]
constraint-dependencies = ["numba>=0.56.0"]
exclude-newer = "7 days"

