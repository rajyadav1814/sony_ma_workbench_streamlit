  <script>
    /* ============================================================
       SONY MUSIC — M&A CATALOG VALUATION WORKBENCH
       App logic (vanilla JS, no frameworks)
       ============================================================ */

    const state = {
      screen: 1,
      completedSteps: new Set(),
      theme: "light",
      searchMode: "Artist",
      searchTerm: "",
      resolvedEntities: [],
      metadataSearch: "",
      screen3YearFilter: [],
      includedAlbums: null,
      territoryMode: "Country selection",
      region: Object.keys((DATA.territories && DATA.territories.regions) || {})[0] || "",
      // null = "not chosen yet": resolved from DATA (default_local / assumptions) at render time.
      localTerritories: null,
      excludedFlags: ["Duplicate", "Outlier", "Incomplete Data"],
      projTracks: null,
      expectedGrowth: null,
      expectedDecay: null,
      albumFilter: "All",
      albumYearFilter: [],
      analyticsTab: 0,
      revenueTab: 0,
      screen5FromYear: "",
      screen5FromMonth: "",
      screen5ToYear: "",
      screen5ToMonth: "",
      screen6FromYear: "",
      screen6FromMonth: "",
      screen6ToYear: "",
      screen6ToMonth: "",

      uploadedFile: null,
      // Pipeline job state
      pipeline: {
        status: "idle", // idle | running | completed | failed
        progress: 0,    // 0-100
        startedAt: null,
        estimatedMinutes: 1,
        errorMessage: null,
        retryCount: 0,
        maxRetries: 2,
        failedStep: null, // which step failed
      },
    };

    const CHECKPOINT_STATE_KEYS = [
      "searchMode", "searchTerm", "resolvedEntities", "metadataSearch",
      "screen3YearFilter", "includedAlbums", "territoryMode", "region",
      "localTerritories", "excludedFlags", "projTracks", "expectedGrowth",
      "expectedDecay", "albumFilter", "albumYearFilter", "analyticsTab",
      "albumChartTab", "revenueTab", "screen5FromYear", "screen5FromMonth", "screen5ToYear",
      "screen5ToMonth", "screen6FromYear", "screen6FromMonth", "screen6ToYear",
      "screen6ToMonth",
    ];

    function getCheckpointState() {
      return CHECKPOINT_STATE_KEYS.reduce((snapshot, key) => {
        snapshot[key] = state[key];
        return snapshot;
      }, {});
    }

    function initIncludedAlbums() {
      if (state.includedAlbums) return;
      const m = {};
      DATA.albums.forEach(a => {
        m[a.album_id] = true;
      });
      state.includedAlbums = m;
    }
    initIncludedAlbums();

    /* ---------------- helpers ---------------- */
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    // Adaptive units so small catalogs don't all collapse to "$0.0M" / "0.0M".
    const _scaled = (v, digits) => {
      v = Number(v) || 0;
      const a = Math.abs(v), f = n => n.toLocaleString("en-US", { maximumFractionDigits: digits });
      if (a >= 1e6) return f(v / 1e6) + "M";
      if (a >= 1e3) return f(v / 1e3) + "K";
      return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
    };
    const fmtUSD = v => "$" + _scaled(v, 1);
    const fmtStreams = v => _scaled(v, 1);
    const fmtUSD4 = v => "$" + Number(v).toFixed(4);
    const fmtNum = v => Number(v).toLocaleString("en-US");
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
    }

    /* ---------------- component builders ---------------- */

    // Multi-select checkbox dropdown builder
    function multiSelectYear(id, allYears, selectedYears, onChangeFn) {
      const allSelected = selectedYears.length === 0; // empty = "All"
      const label = allSelected ? "All" : (selectedYears.length === 1 ? String(selectedYears[0]) : selectedYears.length + " selected");
      const optionsHtml = allYears.map(y => {
        const checked = selectedYears.includes(y) ? "checked" : "";
        return `<label class="ms-option" onclick="event.stopPropagation()">
          <input type="checkbox" ${checked} onchange="${onChangeFn}(${y}, this.checked)"> ${y}
        </label>`;
      }).join("");
      return `<div class="multi-select-dropdown" id="${id}">
        <div class="ms-trigger" onclick="toggleMsDropdown('${id}')">
          <span>${label}</span>
          <span class="ms-arrow">&#9660;</span>
        </div>
        <div class="ms-panel">
          <label class="ms-option ms-all" onclick="event.stopPropagation()">
            <input type="checkbox" ${allSelected ? "checked" : ""} onchange="${onChangeFn}('all', this.checked)"> All
          </label>
          ${optionsHtml}
        </div>
      </div>`;
    }
    function toggleMsDropdown(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle("open");
      // Close on outside click
      if (el.classList.contains("open")) {
        setTimeout(function() {
          function closer(e) { if (!el.contains(e.target)) { el.classList.remove("open"); document.removeEventListener("click", closer); } }
          document.addEventListener("click", closer);
        }, 0);
      }
    }

    function kpiCard(label, value, delta, positive, note) {
      let deltaHtml = "";
      if (delta !== undefined && delta !== null) {
        const cls = positive ? "pos" : "neg";
        const arrow = positive ? "&#9650;" : "&#9660;";
        deltaHtml = `<div class="kpi-delta ${cls}">${arrow}&nbsp;${esc(delta)}</div>`;
      }
      return `<div class="card">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value">${value}</div>
    ${deltaHtml}
    ${note ? `<div class="kpi-note">${esc(note)}</div>` : ""}
  </div>`;
    }

    function sectionTitle(title, caption) {
      return `<div class="section-title">${esc(title)}</div>` +
        (caption ? `<div class="section-caption">${esc(caption)}</div>` : "");
    }

    function tag(text, cls) {
      return `<span class="tag tag-${cls}">${esc(text)}</span>`;
    }

    function table(headers, rows, opts) {
      opts = opts || {};
      const scrollCls = opts.scroll ? "table-scroll" : "";
      let thead = "<tr>" + headers.map(h => `<th>${esc(h)}</th>`).join("") + "</tr>";
      let tbody = rows.map(r => "<tr>" + r + "</tr>").join("");
      return `<div class="table-wrap"><div class="${scrollCls}"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div></div>`;
    }

    /* ---------------- SVG chart builders ---------------- */
    function svgWrap(inner, viewW, viewH) {
      return `<svg viewBox="0 0 ${viewW} ${viewH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
    }

    function niceMax(v) {
      if (v <= 0) return 10;
      const mag = Math.pow(10, Math.floor(Math.log10(v)));
      const norm = v / mag;
      let step;
      if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 5) step = 5; else step = 10;
      return step * mag;
    }

    /* X-axis category labels: horizontal when they fit, rotated (and thinned if very many) when crowded.
       xAxisExtra(n) is the extra bottom space the rotated labels need. */
    const xAxisRotated = n => n > 8;
    const xAxisExtra = n => xAxisRotated(n) ? 30 : 0;
    function xAxisLabel(x, y, text, i, n) {
      if (!xAxisRotated(n)) return `<text x="${x.toFixed(1)}" y="${y}" text-anchor="middle" class="axis-label">${esc(text)}</text>`;
      const every = Math.ceil(n / 40);
      if (i % every !== 0 && i !== n - 1) return "";
      return `<text transform="translate(${x.toFixed(1)},${y - 4}) rotate(-40)" text-anchor="end" class="axis-label">${esc(text)}</text>`;
    }

    /* Vertical bar chart: 1-2 series, grouped or stacked */
    function vBarChart(categories, series, opts) {
      opts = opts || {};
      const W = 880, H = (opts.height || 220) + xAxisExtra(categories.length);
      const padL = 58, padR = 16, padT = 16, padB = 44 + xAxisExtra(categories.length);
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const stacked = !!opts.stacked;
      let maxVal = 0;
      categories.forEach((c, i) => {
        if (stacked) {
          let sum = 0; series.forEach(s => sum += (s.data[i] || 0));
          maxVal = Math.max(maxVal, sum);
        } else {
          series.forEach(s => maxVal = Math.max(maxVal, s.data[i] || 0));
        }
      });
      maxVal = niceMax(maxVal * 1.08);
      const n = categories.length;
      const groupW = plotW / n;
      const barPad = groupW * 0.18;
      const barsAvail = groupW - barPad * 2;
      const seriesW = stacked ? barsAvail : barsAvail / series.length;

      let bars = "";
      let gridLines = "";
      const gridSteps = 4;
      for (let g = 0; g <= gridSteps; g++) {
        const val = maxVal * g / gridSteps;
        const y = padT + plotH - (val / maxVal) * plotH;
        gridLines += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="grid-line"/>`;
        gridLines += `<text x="${padL - 8}" y="${y + 3}" text-anchor="end" class="axis-label">${opts.valueFormatter ? opts.valueFormatter(val) : Math.round(val)}</text>`;
      }

      categories.forEach((cat, i) => {
        const gx = padL + i * groupW + barPad;
        let stackY = padT + plotH;
        series.forEach((s, si) => {
          const v = s.data[i] || 0;
          const h = (v / maxVal) * plotH;
          let x;
          if (stacked) { x = gx; } else { x = gx + si * seriesW; }
          const y = stacked ? (stackY - h) : (padT + plotH - h);
          bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(seriesW - 3).toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="3" fill="${s.color}" opacity="0.92"><title>${esc(cat)} — ${esc(s.name)}: ${fmtNum(v)}</title></rect>`;
          if (stacked) stackY -= h;
        });
        const lx = gx + barsAvail / 2;
        bars += xAxisLabel(lx, H - padB + 18, cat, i, categories.length);
      });

      let legend = "";
      if (series.length > 1) {
        legend = `<g transform="translate(${padL},4)">` + series.map((s, i) =>
          `<g transform="translate(${i * 130},0)"><rect width="9" height="9" rx="2" fill="${s.color}"/><text x="14" y="8.5" class="axis-label" style="font-size:10px">${esc(s.name)}</text></g>`
        ).join("") + `</g>`;
      }

      return `<div class="chart-box">${svgWrap(gridLines + bars + legend, W, H)}</div>`;
    }

    /* Horizontal bar chart: single series, with optional average vline */
    function hBarChart(categories, values, color, opts) {
      opts = opts || {};
      const W = 880, H = opts.height || Math.max(280, categories.length * 34 + 60);
      const padL = 190, padR = 60, padT = 12, padB = 30;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const maxVal = niceMax(Math.max(...values, 0.001) * 1.12);
      const n = categories.length;
      const rowH = plotH / n;
      const barH = rowH * 0.6;

      let bars = "";
      let gridLines = "";
      const gridSteps = 4;
      for (let g = 0; g <= gridSteps; g++) {
        const val = maxVal * g / gridSteps;
        const x = padL + (val / maxVal) * plotW;
        gridLines += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" class="grid-line"/>`;
        gridLines += `<text x="${x}" y="${H - padB + 16}" text-anchor="middle" class="axis-label">${opts.valueFormatter ? opts.valueFormatter(val) : Math.round(val)}</text>`;
      }

      categories.forEach((cat, i) => {
        const v = values[i] || 0;
        const y = padT + i * rowH + (rowH - barH) / 2;
        const w = (v / maxVal) * plotW;
        bars += `<text x="${padL - 10}" y="${(y + barH / 2 + 4).toFixed(1)}" text-anchor="end" class="axis-label" style="font-size:10.5px">${esc(cat.length > 26 ? cat.slice(0, 24) + '…' : cat)}</text>`;
        bars += `<rect x="${padL}" y="${y.toFixed(1)}" width="${Math.max(w, 0).toFixed(1)}" height="${barH.toFixed(1)}" rx="4" fill="${color}" opacity="0.92"><title>${esc(cat)}: ${fmtNum(v)}</title></rect>`;
        bars += `<text x="${(padL + w + 6).toFixed(1)}" y="${(y + barH / 2 + 4).toFixed(1)}" class="bar-value">${opts.valueFormatter ? opts.valueFormatter(v) : fmtNum(v)}</text>`;
      });

      let avgLine = "";
      if (opts.avgLine !== undefined) {
        const ax = padL + (opts.avgLine / maxVal) * plotW;
        avgLine = `<line x1="${ax}" y1="${padT}" x2="${ax}" y2="${H - padB}" stroke="var(--green)" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="${ax}" y="${padT - 2}" text-anchor="middle" style="font-family:var(--font-mono);font-size:10px;fill:var(--green);font-weight:700">AVG ${opts.avgLabel || opts.avgLine}</text>`;
      }

      return `<div class="chart-box">${svgWrap(gridLines + bars + avgLine, W, H)}</div>`;
    }

    /* Line chart: single series */
    function lineChart(categories, values, color, opts) {
      opts = opts || {};
      const W = 880, H = (opts.height || 340) + xAxisExtra(categories.length);
      const padL = 54, padR = 20, padT = 20, padB = 40 + xAxisExtra(categories.length);
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const minV = Math.min(...values, 0);
      const maxV = niceMax(Math.max(...values) * 1.15);
      const n = categories.length;
      const stepX = n > 1 ? plotW / (n - 1) : 0;

      const range = maxV - minV || 1;
      const pts = values.map((v, i) => {
        const x = padL + i * stepX;
        const y = padT + plotH - ((v - minV) / range) * plotH;
        return [x, y];
      });

      let gridLines = "";
      for (let g = 0; g <= 4; g++) {
        const val = minV + (range * g / 4);
        const y = padT + plotH - ((val - minV) / range) * plotH;
        gridLines += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="grid-line"/>`;
        gridLines += `<text x="${padL - 8}" y="${y + 3}" text-anchor="end" class="axis-label">${val.toFixed(1)}%</text>`;
      }
      const zeroY = padT + plotH - ((0 - minV) / range) * plotH;

      const pathD = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const areaD = pathD + ` L${pts[pts.length - 1][0].toFixed(1)},${zeroY} L${pts[0][0].toFixed(1)},${zeroY} Z`;

      let dots = "";
      pts.forEach((p, i) => {
        dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"><title>${esc(categories[i])}: ${values[i]}%</title></circle>`;
        dots += `<text x="${p[0].toFixed(1)}" y="${(p[1] - 12).toFixed(1)}" text-anchor="middle" class="axis-label" style="font-weight:700">${values[i]}%</text>`;
        dots += xAxisLabel(p[0], H - padB + 18, categories[i], i, categories.length);
      });

      return `<div class="chart-box">${svgWrap(
        gridLines +
        `<path d="${areaD}" fill="${color}" opacity="0.08"/>` +
        `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` +
        dots, W, H)}</div>`;
    }

    /* Multi-series line chart */
    function multiLineChart(categories, series, opts) {
      opts = opts || {};
      const W = 880, H = (opts.height || 340) + xAxisExtra(categories.length);
      const padL = 70, padR = opts.dualAxis ? 70 : 20, padT = 20, padB = 40 + xAxisExtra(categories.length);
      const plotW = W - padL - padR, plotH = H - padT - padB;

      // Separate primary and secondary axis series
      const primarySeries = series.filter(s => !s.secondaryAxis);
      const secondarySeries = series.filter(s => s.secondaryAxis);

      const primaryVals = primarySeries.flatMap(s => s.data);
      const minV = Math.min(...primaryVals, 0);
      const maxV = niceMax(Math.max(...primaryVals) * 1.15);
      const range = maxV - minV || 1;

      let minV2 = 0, maxV2 = 1, range2 = 1;
      if (secondarySeries.length) {
        const secVals = secondarySeries.flatMap(s => s.data);
        minV2 = Math.min(...secVals, 0);
        maxV2 = Math.max(...secVals) * 1.15;
        if (maxV2 <= minV2) maxV2 = minV2 + 1;
        range2 = maxV2 - minV2;
      }

      const n = categories.length;
      const stepX = n > 1 ? plotW / (n - 1) : 0;

      let gridLines = "";
      for (let g = 0; g <= 4; g++) {
        const val = minV + (range * g / 4);
        const y = padT + plotH - ((val - minV) / range) * plotH;
        gridLines += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="grid-line"/>`;
        gridLines += `<text x="${padL - 8}" y="${y + 3}" text-anchor="end" class="axis-label">${fmtNum(Math.round(val))}</text>`;
      }

      // Secondary Y-axis labels
      if (opts.dualAxis && secondarySeries.length) {
        for (let g = 0; g <= 4; g++) {
          const val = minV2 + (range2 * g / 4);
          const y = padT + plotH - ((val - minV2) / range2) * plotH;
          gridLines += `<text x="${W - padR + 8}" y="${y + 3}" text-anchor="start" class="axis-label" fill="#1E9E5A">${val.toFixed(1)}%</text>`;
        }
      }

      let xLabels = "";
      categories.forEach((cat, i) => {
        const x = padL + i * stepX;
        xLabels += xAxisLabel(x, H - padB + 18, cat, i, categories.length);
      });

      let lines = "";
      series.forEach(s => {
        const isSecondary = s.secondaryAxis;
        const sMinV = isSecondary ? minV2 : minV;
        const sRange = isSecondary ? range2 : range;
        const pts = s.data.map((v, i) => {
          const x = padL + i * stepX;
          const y = padT + plotH - ((v - sMinV) / sRange) * plotH;
          return [x, y];
        });
        const pathD = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
        const dashAttr = s.dashed ? ' stroke-dasharray="6,4"' : '';
        lines += `<path d="${pathD}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${dashAttr}/>`;
        pts.forEach((p, i) => {
          const valLabel = isSecondary ? s.data[i].toFixed(1) + "%" : fmtNum(s.data[i]);
          lines += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.name)} — ${esc(categories[i])}: ${valLabel}</title></circle>`;
        });
      });

      let legend = `<div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap;">`;
      series.forEach(s => {
        const lineStyle = s.dashed ? 'border-top:2px dashed ' + s.color + ';width:12px;height:0;display:inline-block;' : 'width:12px;height:12px;border-radius:2px;background:' + s.color + ';display:inline-block;';
        legend += `<span style="display:flex;align-items:center;gap:5px;font-size:.8rem;"><span style="${lineStyle}"></span>${esc(s.name)}</span>`;
      });
      legend += `</div>`;

      return `<div class="chart-box">${svgWrap(gridLines + xLabels + lines, W, H)}</div>` + legend;
    }

    /* Donut chart */
    function donutChart(labels, values, colors, opts) {
      opts = opts || {};
      const W = 420, H = opts.height || 300;
      const cx = W / 2, cy = H / 2 - 8, r = Math.min(W, H) / 2 - 20, r0 = r * 0.58;
      const total = values.reduce((a, b) => a + b, 0) || 1;
      let angle = -Math.PI / 2;
      let paths = "";
      const legend = [];
      labels.forEach((lab, i) => {
        const v = values[i];
        const frac = v / total;
        const a0 = angle;
        const a1 = angle + frac * Math.PI * 2;
        angle = a1;
        const large = (a1 - a0) > Math.PI ? 1 : 0;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const xi0 = cx + r0 * Math.cos(a1), yi0 = cy + r0 * Math.sin(a1);
        const xi1 = cx + r0 * Math.cos(a0), yi1 = cy + r0 * Math.sin(a0);
        const d = `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xi0.toFixed(2)},${yi0.toFixed(2)} A${r0},${r0} 0 ${large} 0 ${xi1.toFixed(2)},${yi1.toFixed(2)} Z`;
        paths += `<path d="${d}" fill="${colors[i]}"><title>${esc(lab)}: ${(frac * 100).toFixed(1)}%</title></path>`;
        legend.push(`<div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:3px;background:${colors[i]};display:inline-block;"></span><span style="font-family:var(--font-mono);font-size:.76rem;color:var(--text-dim)">${esc(lab)}</span><span style="font-family:var(--font-mono);font-size:.76rem;font-weight:700;margin-left:auto">${(frac * 100).toFixed(1)}%</span></div>`);
      });
      const centerText = `<text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-family:var(--font-serif);font-weight:800;font-size:22px;fill:var(--text)">${labels.length}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="axis-label">SEGMENTS</text>`;
      return `<div class="chart-box"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
    <div style="flex:0 0 auto;width:220px">${svgWrap(paths + centerText, W, H)}</div>
    <div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px">${legend.join("")}</div>
  </div></div>`;
    }

    /* ============================================================
       SCREEN RENDERERS
       ============================================================ */


    function navButtons(nextDisabled) {
      const back = state.screen > 1 ? `<button class="btn secondary" onclick="goScreen(${state.screen - 1})">&larr; Back</button>` : `<span></span>`;
      let next = `<span></span>`;
      if (state.screen < 8) {
        const dis = nextDisabled ? ' disabled title="Please fill in the required field to continue"' : '';
        next = `<button class="btn"${dis} onclick="goScreen(${state.screen + 1})">Next &rarr;</button>`;
      }
      return `<div style="margin: 34px 0 10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          ${back}<div class="spacer"></div>${next}
        </div>
      </div>`;
    }

    function getAmbiguityMatches() {
      // Prefer the exact live-query key, then tolerate casing/spacing changes
      // between the selected artist and the server-returned result key.
      var matchesByTerm = DATA.ambiguity_matches || {};
      var term = String(state.searchTerm || '').trim();
      if (term && matchesByTerm[term]) return matchesByTerm[term];

      var normalizedTerm = term.toLowerCase();
      var matchingKey = Object.keys(matchesByTerm).find(function(key) {
        return String(key).trim().toLowerCase() === normalizedTerm;
      });
      if (matchingKey) return matchesByTerm[matchingKey];

      const items = [...list.querySelectorAll('.autocomplete-item')].filter(i => i.style.display !== 'none');
      const active = list.querySelector('.autocomplete-item.active');
      let idx = items.indexOf(active);
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (active) active.classList.remove('active');
        idx = (idx + 1) % items.length;
        items[idx] && items[idx].classList.add('active');
        items[idx] && items[idx].scrollIntoView({ block: 'nearest' });
      } else if (event.key === 'ArrowUp') {

    function uploadAmbiguityData(input) {
      if (!input.files || !input.files[0]) return;
      var file = input.files[0];
      var reader = new FileReader();
      reader.onload = function(evt) {
        try {
          var text = evt.target.result;
          var lines = text.split(/\r?\n/).filter(function(l) { return l.trim().length > 0; });
          if (lines.length < 2) { toast("File is empty or has no data rows"); return; }
          // Detect separator
          var sep = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
          // Parse CSV properly handling quoted fields
          function parseCsvLine(line, delimiter) {
            var result = [];
            var current = '';
            var inQuotes = false;
            for (var i = 0; i < line.length; i++) {
              var ch = line[i];
              if (inQuotes) {
                if (ch === '"' && i + 1 < line.length && line[i + 1] === '"') {
                  current += '"'; i++;
                } else if (ch === '"') {
                  inQuotes = false;
                } else {
                  current += ch;
                }
              } else {
                if (ch === '"') { inQuotes = true; }
                else if (ch === delimiter) { result.push(current.trim()); current = ''; }
                else { current += ch; }
              }
            }
            result.push(current.trim());
            return result;
          }
          var header = parseCsvLine(lines[0], sep);
          // Find columns by header name
          var nameCol = -1, countCol = -1;
          for (var i = 0; i < header.length; i++) {
            var h = header[i].toLowerCase().replace(/^["']|["']$/g, '');
            if (h === 'name' || h === 'artist' || h === 'entity' || h === 'display_artist') nameCol = i;
            if (h === 'album count' || h === 'track_count' || h === 'count' || h === 'albums') countCol = i;
          }
          if (nameCol === -1) nameCol = 0;
          if (countCol === -1 && header.length > 1) countCol = 1;

          var newMatches = [];
          for (var r = 1; r < lines.length; r++) {
            var cols = parseCsvLine(lines[r], sep);
            var name = cols[nameCol] || '';
            if (!name) continue;
            var count = countCol >= 0 ? (parseInt(cols[countCol]) || 0) : 0;
            newMatches.push({
              id: r,
              name: name,
              confidence: r === 1 ? "High" : "Medium",
              track_count: count,
              recommended: r === 1
            });
          }
          if (!newMatches.length) { toast("No valid data found in file"); return; }
          // Overwrite the ambiguity matches for the current search term
          var key = state.searchTerm || Object.keys(DATA.ambiguity_matches)[0] || 'uploaded';
          DATA.ambiguity_matches[key] = newMatches;
          // Clear selection and re-render
          state.resolvedEntities = [];
          toast("Uploaded " + newMatches.length + " entries — select the ones to include");
          render();
        } catch(e) {
          console.error(e);
          toast("Upload failed — please use a CSV file with Name and Album Count columns");
        }
      };
      reader.readAsText(file);
      // Reset input so same file can be re-uploaded
      input.value = '';
    }

            <th>Artist</th>
            <th>Release Type</th>
            <th class="num">Release Year</th>
            <th>Format</th>
            <th>Imprint</th>
          </tr></thead>
          <tbody>${albumRows.map(r => "<tr>" + r + "</tr>").join("")}</tbody>
        </table></div>`;

      return `
    <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;">
      <div class="field" style="margin:0; flex:1; max-width:400px;">
        <label class="field-label" for="metadataSearchInput">Search by Album, Artist or ISRC</label>
        <input id="metadataSearchInput" type="text" placeholder="Type to filter..." value="${esc(state.metadataSearch)}" oninput="setMetadataSearch(this.value)" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);">
      </div>
      <div class="field" style="margin:0; max-width:180px;">
        <div class="field-label">Release Year</div>
        ${multiSelectYear("ms-year-s3", allYears3, yearFilter3, "toggleScreen3Year")}
      </div>
    </div>
      ${tableHtml}
      ${navButtons(false)}
    `;
    }
    function toggleAlbumInclude(id, val) { state.includedAlbums[id] = val; renderKeepScroll(); }
    function toggleSelectAllAlbums(checked) {
      var el = document.getElementById('screen3-table');
      if (!el) return;
      var inputs = Array.from(el.querySelectorAll('.row-check'));

        var id = inp.getAttribute('data-album-id');

    function setMetadataSearch(v) { state.metadataSearch = v; renderKeepScroll(); }
    function toggleScreen3Year(year, checked) {
      if (year === 'all') {
        state.screen3YearFilter = [];
      } else {
        var arr = state.screen3YearFilter || [];
        if (checked) {
          if (!arr.includes(year)) arr.push(year);
        } else {
          arr = arr.filter(function(y) { return y !== year; });
        }
        state.screen3YearFilter = arr;
      }
      render();
    }


    /* ============================================================
       STEPS 4-8 — every figure below is read from DATA (database-driven,
       computed per catalog by analytics.py). Nothing here is hardcoded.
       ============================================================ */
    const SEGMENT_KEYS = ["audio_premium", "audio_ad_supported", "video_premium", "video_ad_supported"];
    const SEGMENT_NAMES = {
      audio_premium: "Audio Premium", audio_ad_supported: "Audio Ad Supported",
      video_premium: "Video Premium", video_ad_supported: "Video Ad Supported",
    };
    const fmtPpd = v => (v === null || v === undefined) ? "-" : Number(v).toFixed(6);
    const fmtShare = (n, d) => d > 0 ? (n / d * 100).toFixed(1) + "%" : "-";

    function assumption(key, fallback) {
      const a = DATA.assumptions || {};
      return (a[key] !== undefined && a[key] !== null) ? a[key] : fallback;
    }
    function expectedGrowth() { return state.expectedGrowth !== null && state.expectedGrowth !== undefined ? state.expectedGrowth : assumption("expected_growth", 0); }
    function expectedDecay() { return state.expectedDecay !== null && state.expectedDecay !== undefined ? state.expectedDecay : assumption("expected_decay", 0); }
    function projectedTracks() { return state.projTracks !== null && state.projTracks !== undefined ? state.projTracks : assumption("projected_tracks", 0); }

    /* Local territories: the user's choice, else the catalog's default (config or top countries). */
    function getLocalTerritories() {
      const all = (DATA.territories && DATA.territories.countries) || [];
      const defaults = (DATA.territories && DATA.territories.default_local) || [];
      if (!Array.isArray(state.localTerritories)) {
        state.localTerritories = defaults.slice();
      } else if (all.length) {
        // Drop names that don't exist in this catalog (e.g. restored from an earlier catalog).
        const valid = state.localTerritories.filter(c => all.includes(c));
        state.localTerritories = (valid.length || !state.localTerritories.length) ? valid : defaults.slice();
      }
      return state.localTerritories;
    }
    function localCodeSet() {
      const codes = (DATA.territories && DATA.territories.codes) || {};
      return new Set(getLocalTerritories().map(n => codes[n]).filter(Boolean));
    }
    function includedAlbums() {
      return (DATA.albums || []).filter(a => state.includedAlbums && state.includedAlbums[a.album_id]);
    }
    /* Current (last-12-month) revenue of the included albums, split by the chosen local territories. */
    function localRowRevenue() {
      const local = localCodeSet(), byAlbum = DATA.album_country_revenue || {};
      let l = 0, r = 0;
      includedAlbums().forEach(a => {
        const perCountry = byAlbum[a.album_id];
        if (!perCountry) return;
        Object.keys(perCountry).forEach(cc => { if (local.has(cc)) l += perCountry[cc]; else r += perCountry[cc]; });
      });
      return { local: l, row: r, total: l + r };
    }

    /* Steps 4-8 show a notice only when something is wrong (analytics failed, or there is no consumption data). */
    function dataBanner() {
      const st = DATA.data_status || {};
      if (DATA.analytics_error) {
        return `<div class="notice error"><strong>Analytics could not be computed.</strong> Please retry or contact support.
          <details class="notice-details"><summary>Technical details</summary>${esc(DATA.analytics_error)}</details></div>`;
      }
      if (!st.has_streaming_data) {
        return `<div class="notice warn"><strong>No consumption data for this catalog.</strong> Figures that depend on consumption are left empty rather than estimated.
          <details class="notice-details"><summary>Technical details</summary>${esc(st.reason || "")}</details></div>`;
      }
      return "";
    }

    /* ---- SCREEN 4 : LOCAL TERRITORY MAPPING ---- */
    var _territoryDDOpen = false;

    /* Per-country and Local / RoW group statistics for the current selection. */
    function territoryModel() {
      const local = new Set(getLocalTerritories());
      const rows = (DATA.country_stats || []).map(r => Object.assign({}, r, {
        streams: (r.audio_streams || 0) + (r.video_streams || 0),
        isLocal: local.has(r.country),
      }));
      const sum = (list, k) => list.reduce((s, r) => s + (r[k] || 0), 0);
      const ratio = (n, d) => d > 0 ? n / d : null;
      const group = list => ({
        streams: sum(list, "streams"),
        audio: ratio(sum(list, "audio_revenue"), sum(list, "audio_streams")),
        video: ratio(sum(list, "video_revenue"), sum(list, "video_streams")),
      });
      return { rows, all: group(rows), local: group(rows.filter(r => r.isLocal)), row: group(rows.filter(r => !r.isLocal)) };
    }

    function renderScreen4() {
      const allCountries = (DATA.territories && DATA.territories.countries) || [];
      const banner = dataBanner();
      if (!allCountries.length) {
        return `${banner}<div class="notice info">No territory data is available for this catalog yet.</div>${navButtons(false)}`;
      }
      const selected = getLocalTerritories();
      const selectedTags = selected.map(c =>
        `<span class="ms-tag"><span class="ms-tag-text">${esc(c)}</span><span class="ms-tag-remove" onclick="event.stopPropagation();removeTerritory('${esc(c)}')">&times;</span></span>`
      ).join("");

      const allSelected = selected.length === allCountries.length;
      const optionItems = allCountries.map(c => {
        const sel = selected.includes(c);
        return `<div class="ms-option ${sel ? 'ms-option-sel' : ''}" onclick="event.stopPropagation();toggleTerritory('${esc(c)}')"><span class="ms-checkbox ${sel ? 'ms-checkbox-checked' : ''}"></span>${esc(c)}</div>`;
      }).join("");

      const ddDisplay = _territoryDDOpen ? 'block' : 'none';

      const selector = `<div class="field" style="position:relative; z-index:100;"><div class="field-label">LOCAL TERRITORIES</div>
      <div class="ms-select-wrapper" id="msSelectWrapper">
        <div class="ms-select-control" onclick="toggleTerritoryDropdown()">
          <div class="ms-tags-area">${selectedTags || '<span class="ms-placeholder">Select territories...</span>'}</div>
          <div class="ms-arrow">${_territoryDDOpen ? '&#9650;' : '&#9660;'}</div>
        </div>
        <div class="ms-dropdown" id="msDropdown" style="display:${ddDisplay};">
          <div class="ms-option ms-option-all ${allSelected ? 'ms-option-sel' : ''}" onclick="event.stopPropagation();toggleAllTerritories()"><span class="ms-checkbox ${allSelected ? 'ms-checkbox-checked' : ''}"></span>All</div>
          <div class="ms-options-list" id="msOptionsList">${optionItems}</div>
        </div>
      </div></div>`;

      const m = territoryModel();
      const worldwide = `<td><strong>Worldwide</strong></td><td class="num">${fmtNum(m.all.streams)}</td><td class="num">100%</td><td>Worldwide</td><td class="num">${fmtPpd(m.all.audio)}</td><td class="num">${fmtPpd(m.all.video)}</td><td class="num">${fmtShare(m.local.streams, m.all.streams)}</td><td class="num">${fmtShare(m.row.streams, m.all.streams)}</td><td class="num">${fmtPpd(m.local.audio)}</td><td class="num">${fmtPpd(m.local.video)}</td><td class="num">${fmtPpd(m.row.audio)}</td><td class="num">${fmtPpd(m.row.video)}</td><td class="num">${fmtPpd(m.all.audio)}</td>`;
      const countryRows = m.rows.map(r => {
        const audio = r.audio_streams > 0 ? r.audio_revenue / r.audio_streams : null;
        const video = r.video_streams > 0 ? r.video_revenue / r.video_streams : null;
        return `<td>${esc(r.country)}</td><td class="num">${fmtNum(r.streams)}</td><td class="num">${fmtShare(r.streams, m.all.streams)}</td>`
          + `<td style="color: ${r.isLocal ? 'var(--tag-green-text)' : 'var(--text-dim)'}">${r.isLocal ? "Local" : "RoW"}</td>`
          + `<td class="num">${fmtPpd(audio)}</td><td class="num">${fmtPpd(video)}</td>`
          + `<td class="num">${r.isLocal ? fmtShare(r.streams, m.local.streams) : "-"}</td><td class="num">${r.isLocal ? "-" : fmtShare(r.streams, m.row.streams)}</td>`
          + `<td class="num">${r.isLocal ? fmtPpd(audio) : "-"}</td><td class="num">${r.isLocal ? fmtPpd(video) : "-"}</td>`
          + `<td class="num">${r.isLocal ? "-" : fmtPpd(audio)}</td><td class="num">${r.isLocal ? "-" : fmtPpd(video)}</td>`
          + `<td class="num">${fmtPpd(audio)}</td>`;
      });

      return `
    ${banner}
    ${selector}
    <div class="grid grid-4" style="margin-top:6px; position:relative; z-index:1;">
      ${kpiCard("Local Territories Selected", selected.length)}
      ${kpiCard("Rest of World (ROW)", (allCountries.length - selected.length) + " territories")}
      ${kpiCard("Local Share of Consumption", fmtShare(m.local.streams, m.all.streams))}
      ${kpiCard("Total Consumption", fmtStreams(m.all.streams), null, true, "streams across all territories")}
    </div>
    <div style="margin-top: 24px; position:relative; z-index:1;">
      ${sectionTitle("Country Wise Output", "Consumption and PPD (revenue / streams) by territory. Local % and RoW % are each territory's share of its own group.")}
      ${table(
        ["Country Name", "Consumption", "% of total", "Local Mapping", "Audio PPD's", "Video PPD's", "Local %", "Rest of the World %", "Local Audio PPD", "Local Video PPD", "RoW Audio PPD", "RoW Video PPD", "Total Audio PPD"],
        [worldwide, ...countryRows],
        { scroll: true }
      )}
    </div>
    ${navButtons(false)}
  `;
    }
    function toggleTerritory(c) {
      const sel = getLocalTerritories();
      const idx = sel.indexOf(c);

      render();

    function removeTerritory(c) {

      const idx = sel.indexOf(c);
      if (idx >= 0) sel.splice(idx, 1);
      render();
    }
    function toggleAllTerritories() {
      const allCountries = (DATA.territories && DATA.territories.countries) || [];
      if (getLocalTerritories().length === allCountries.length) {

      } else {
        state.localTerritories = [...allCountries];

    function toggleTerritoryDropdown() {

    document.addEventListener('click', function(e) {

      }
    });


    /* ---- SCREEN 5 : CATALOG ANALYTICS ---- */
    /* PPD by year (BOBWA table) when available, otherwise the current PPD per segment. */
    function _ppdTable(keys, label) {
      const ppd = DATA.ppd_by_year || [];
      const name = k => SEGMENT_NAMES[k] || k;
      if (!ppd.length) {
        const current = (DATA.ppd && DATA.ppd.current_splits) || {};
        if (!keys.some(k => current[k] !== undefined)) return "";
        const src = (DATA.ppd && DATA.ppd.source === "table") ? "from PPD table" : "assumed";
        return `<div class="card" style="margin-top:14px;">
        <div class="kpi-label">${esc(label)} — Current PPD (${src}; no PPD-by-year data)</div>
        <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Segment</th><th>Current PPD</th></tr></thead>
        <tbody>${keys.map(k => `<tr><td class="strong">${esc(name(k))}</td><td class="num">${fmtUSD4(current[k] || 0)}</td></tr>`).join("")}</tbody></table></div></div>`;
      }
      const buckets = ppd.map(p => p.bucket);
      const rows = keys.map(k => `<tr><td class="strong">${esc(name(k))}</td>${ppd.map(p => `<td class="num">${fmtUSD4(p[k] || 0)}</td>`).join("")}</tr>`);
      return `<div class="card" style="margin-top:14px;">
        <div class="kpi-label">${esc(label)} — PPD by Year (Wholesale Value / Units)</div>
        <div style="overflow-x:auto">
          <table class="data-table"><thead><tr><th>Segment</th>${buckets.map(b => `<th>${esc(b)}</th>`).join("")}</tr></thead>
          <tbody>${rows.join("")}</tbody></table>
        </div></div>`;
    }

    /* Shared year/month filter builder. opts.label names the filter; opts.months=false hides month pickers. */
    var _MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function _yearMonthFilterHtml(prefix, stateObj, opts) {
      opts = opts || {};
      var withMonths = opts.months !== false;
      var fy = stateObj[prefix + "FromYear"];
      var fm = stateObj[prefix + "FromMonth"];
      var ty = stateObj[prefix + "ToYear"];
      var tm = stateObj[prefix + "ToMonth"];
      var hasFilter = fy || ty;
      var inpStyle = "width:56px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);font-size:0.75rem;text-align:center;";
      var selStyle = "width:58px;padding:3px 2px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);font-size:0.75rem;";
      var lStyle = "font-size:0.75rem;font-weight:500;color:var(--fg);opacity:0.7;margin:0;white-space:nowrap;";

      var monthOpts = '<option value="">--</option>' + _MONTH_NAMES.map(function(n, i) { return '<option value="' + (i + 1) + '"' + (fm == (i + 1) ? ' selected' : '') + '>' + n + '</option>'; }).join("");
      var monthOpts2 = '<option value="">--</option>' + _MONTH_NAMES.map(function(n, i) { return '<option value="' + (i + 1) + '"' + (tm == (i + 1) ? ' selected' : '') + '>' + n + '</option>'; }).join("");

      var html = '<div style="display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;">';
      html += '<span style="' + lStyle + '">' + esc(opts.label || "Period") + ':</span>';
      html += '<span style="' + lStyle + '">From</span>';
      html += '<input type="number" placeholder="Year" min="1900" max="2099" value="' + (fy || '') + '" onchange="set_' + prefix + 'FromYear(this.value)" style="' + inpStyle + '">';
      if (withMonths) html += '<select onchange="set_' + prefix + 'FromMonth(this.value)" style="' + selStyle + '">' + monthOpts + '</select>';
      html += '<span style="' + lStyle + '">To</span>';
      html += '<input type="number" placeholder="Year" min="1900" max="2099" value="' + (ty || '') + '" onchange="set_' + prefix + 'ToYear(this.value)" style="' + inpStyle + '">';
      if (withMonths) html += '<select onchange="set_' + prefix + 'ToMonth(this.value)" style="' + selStyle + '">' + monthOpts2 + '</select>';
      if (hasFilter) {
        html += '<button onclick="clear_' + prefix + 'Filter()" style="padding:2px 7px;font-size:0.7rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer;">Clear</button>';
      }
      html += '</div>';
      return html;
    }

    /* Monthly consumption within the Step 5 period filter (year + optional month on both ends). */
    function _screen5Months() {
      const fy = state.screen5FromYear ? parseInt(state.screen5FromYear) : null;
      const ty = state.screen5ToYear ? parseInt(state.screen5ToYear) : null;
      const from = fy ? fy * 100 + (parseInt(state.screen5FromMonth) || 1) : null;
      const to = ty ? ty * 100 + (parseInt(state.screen5ToMonth) || 12) : null;
      return (DATA.consumption_monthly || []).filter(r => {
        const ym = parseInt(r.ym.slice(0, 4)) * 100 + parseInt(r.ym.slice(5, 7));
        return (!from || ym >= from) && (!to || ym <= to);
      });
    }
    function _halfYearBuckets(months) {
      const out = {};
      months.forEach(r => {
        const key = r.ym.slice(0, 4) + " " + (parseInt(r.ym.slice(5, 7)) <= 6 ? "Jan-Jun" : "Jul-Dec");
        if (!out[key]) { out[key] = { bucket: key }; SEGMENT_KEYS.forEach(s => out[key][s] = 0); }
        SEGMENT_KEYS.forEach(s => out[key][s] += r[s] || 0);
      });
      return Object.keys(out).sort().map(k => out[k]);
    }

    function renderScreen5() {
      const ageSplit = DATA.catalog_age_split || {};

          { name: "Audio Premium", color: "#E1261C", data: matrix.map(m => m.audio_premium) },
          { name: "Audio Ad Supported", color: "#8A8A8A", data: matrix.map(m => m.audio_ad_supported) },
        ], { stacked: true }) +
          _ppdTable(["audio_premium", "audio_ad_supported"], "Audio");
      } else if (t === 2) {
        tabContent = vBarChart(buckets, [
          { name: "Video Premium", color: "#2A63C7", data: matrix.map(m => m.video_premium) },
          { name: "Video Ad Supported", color: "#8A8A8A", data: matrix.map(m => m.video_ad_supported) },
        ], { stacked: true }) +
          _ppdTable(["video_premium", "video_ad_supported"], "Video");
      } else if (t === 3) {
        tabContent = vBarChart(buckets, [
          { name: "Audio Premium", color: "#E1261C", data: matrix.map(m => m.audio_premium) },
          { name: "Video Premium", color: "#2A63C7", data: matrix.map(m => m.video_premium) },
        ], { stacked: false }) +
          _ppdTable(["audio_premium", "video_premium"], "Premium");
      } else if (t === 4) {
        tabContent = vBarChart(buckets, [
          { name: "Audio Ad Supported", color: "#B9861F", data: matrix.map(m => m.audio_ad_supported) },
          { name: "Video Ad Supported", color: "#8A8A8A", data: matrix.map(m => m.video_ad_supported) },
        ], { stacked: false }) +
          _ppdTable(["audio_ad_supported", "video_ad_supported"], "Ad Supported");
      } else {
        let g = (DATA.growth_trend || []).filter(x => x.yoy_growth_pct !== null && x.yoy_growth_pct !== undefined);
        if (fromYear5) g = g.filter(x => parseInt(x.year) >= fromYear5);
        if (toYear5) g = g.filter(x => parseInt(x.year) <= toYear5);
        if (!g.length) {
          tabContent = `<div class="notice info">No growth trend available${status.has_streaming_data ? " for the selected period" : ""} (needs at least two years of consumption).</div>`;
        } else {
          const partial = g.filter(x => x.partial);
          const mSrc = mg.market_source === "config" ? "configured" : "assumed";
          tabContent = lineChart(g.map(x => x.year + (x.partial ? "*" : "")), g.map(x => x.yoy_growth_pct), "#E1261C")
            + (partial.length ? `<div class="section-caption">* Like-for-like: compared over only the months both years have data (${partial.map(x => x.year + ": " + x.months_compared + " months").join(", ")}).</div>` : "")
            + `<p><strong>Market Growth Comparison:</strong> Artist Growth <strong>${mg.artist_growth_pct}%</strong>${mg.growth_year ? " (" + mg.growth_year + ")" : ""} vs `
            + `Market Growth <strong>${mg.market_growth_pct === null || mg.market_growth_pct === undefined ? "n/a" : mg.market_growth_pct + "%"}</strong> (${mSrc} benchmark)</p>`;
        }
      }

      const first = status.first_month ? status.first_month.slice(0, 4) : "", last = status.latest_month ? status.latest_month.slice(0, 4) : "";
      const filterHtml = _yearMonthFilterHtml("screen5", state, { label: "Period" });
      const basis = ageSplit.basis === "streams" ? "share of streams, by release year"
        : ageSplit.basis === "albums" ? "share of albums (no consumption data)" : "no release-year data";
      const growthDelta = mg.growth_year ? `${mg.growth_year} vs ${mg.growth_year - 1}` : null;

      return `
    ${dataBanner()}

    // Aggregate release_year_consumption by consumption year for selected release years
    function _aggregateByConsumptionYear(fromRY, toRY) {
      var ryc = DATA.release_year_consumption || [];
      if (!ryc.length) return null;
      // Filter to selected release year range
      var filtered = ryc.filter(function(r) {
        if (fromRY && r.release_year < fromRY) return false;
        if (toRY && r.release_year > toRY) return false;
        return true;
      });
      if (!filtered.length) return null;
      // Group by consumption_year
      var byYear = {};
      filtered.forEach(function(r) {
        var cy = r.consumption_year;
        if (!byYear[cy]) byYear[cy] = { streams: 0, revenue: 0 };
        byYear[cy].streams += r.streams;
        byYear[cy].revenue += r.revenue_usd;
      });
      // Only show consumption years from the From year onwards
      var years = Object.keys(byYear).map(Number).filter(function(y) {
        return !fromRY || y >= fromRY;
      }).sort();
      var result = [];
      var prev = null;
      years.forEach(function(y) {
        var s = byYear[y].streams;
        var yoy = (prev && prev > 0) ? Math.round((s - prev) / prev * 1000) / 10 : 0;
        result.push({
          bucket: String(y),
          consumption_streams: s,
          revenue_usd: Math.round(byYear[y].revenue * 100) / 100,
          yoy_growth_pct: yoy,
        });
        prev = s;
      });
      return result;
    }
