  <style>
    /* ============================================================
   SONY MUSIC — M&A CATALOG VALUATION WORKBENCH
   Vanilla HTML / CSS / JS build — no frameworks, no Streamlit
   ============================================================ */

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: var(--font-sans);
      --font-mono: var(--font-sans);

      --accent: #E1261C;
      --accent-2: #B81E16;
      --accent-soft: rgba(225, 38, 28, 0.10);
      --green: #1E9E5A;
      --green-soft: rgba(30, 158, 90, 0.10);
      --gold: #B9861F;
      --gold-soft: rgba(185, 134, 31, 0.12);
      --blue: #2A63C7;
      --blue-soft: rgba(42, 99, 199, 0.10);
      --purple: #6B4FCE;
      --purple-soft: rgba(107, 79, 206, 0.10);
      --teal: #1B8A82;
      --teal-soft: rgba(27, 138, 130, 0.10);

      --radius-s: 8px;
      --radius-m: 14px;
      --radius-l: 20px;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #F1EFE7;
      --bg-radial: rgba(225, 38, 28, 0.05);
      --surface: #FFFFFF;
      --surface-2: #FAF9F4;
      --surface-hover: #FFFFFF;
      --border: rgba(20, 18, 14, 0.11);
      --border-strong: rgba(20, 18, 14, 0.20);
      --text: #141210;
      --text-dim: #5A564C;
      --text-mute: #8F8A7E;
      --shadow: 0 10px 30px rgba(20, 18, 14, 0.08);
      --track-bg: #DAD7CC;
      --chip-bg: rgba(20, 18, 14, 0.045);
      --scrollbar: rgba(20, 18, 14, 0.32);
      --accent-contrast: #FFFFFF;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0A0A0A;
      --bg-radial: rgba(225, 38, 28, 0.09);
      --surface: #141414;
      --surface-2: #1A1A1A;
      --surface-hover: #1D1D1D;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #F1EFEA;
      --text-dim: #A8A49C;
      --text-mute: #6E6B64;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      --track-bg: #2A2A2A;
      --chip-bg: rgba(255, 255, 255, 0.05);
      --scrollbar: rgba(255, 255, 255, 0.18);
      --accent-contrast: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    html {
      height: auto;
      overflow-y: visible;
    }

    body {
      background:
        radial-gradient(ellipse 80% 36% at 50% -8%, var(--bg-radial) 0%, transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: auto;
      overflow-y: visible;
      overflow-x: hidden;
      transition: background .35s ease, color .35s ease;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 10px;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 52px 32px;
    }

    /* ---------- HEADER ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1.5px solid var(--text);
    }

    .topbar-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      margin: 0 20px;
    }

    .topbar-title {
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.015em;
      color: #c51616cf;
      margin-bottom: 0px;
      line-height: 1.1;
    }

    .topbar-title em {
      font-style: normal;
      font-weight: 700;
      color: inherit;
    }

    .topbar-desc {
      font-family: var(--font-sans);
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1.5;
      max-width: 925px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }


    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2px;
    }

    .brand-mark span {
      border-radius: 50%;
      background: var(--accent);
      opacity: .85;
    }

    .brand-mark span:nth-child(3n) {
      opacity: .45;
    }

    .brand-mark span:nth-child(7),
    .brand-mark span:nth-child(13),
    .brand-mark span:nth-child(19) {
      opacity: 1;
    }

    .brand-text {
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .brand-name {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: .8rem;
      letter-spacing: .22em;
      color: var(--text);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-strong);
      margin-bottom: 4px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: .72rem;
      letter-spacing: .22em;
      color: var(--text);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-family: var(--font-mono);
      font-size: .66rem;
      color: var(--text-dim);
      letter-spacing: .08em;
    }

    .toggle-track {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 20px;
      background: var(--track-bg);
      border: 1px solid var(--border-strong);
      transition: .25s;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      transition: .25s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    html[data-theme="light"] .toggle-thumb {
      transform: translateX(20px);
    }

    /* ---------- META ROW ---------- */
    .entity-chip {
      background: var(--chip-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      color: var(--text);
      font-weight: 600;
    }

    /* ---------- HEADLINE ---------- */
    .headline {
      font-family: var(--font-sans);
      font-weight: 700;
      font-style: normal;
      font-size: clamp(1.9rem, 3.4vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: -0.015em;
      margin: 12px 0 8px;
      color: var(--text);
    }

    .headline em {
      font-style: normal;
      font-weight: 700;
      color: var(--text-dim);
    }

    .sub-headline {
      font-family: var(--font-sans);
      color: var(--text-dim);
      font-size: .95rem;
      line-height: 1.6;
      margin: 0 0 6px;
      max-width: 1300px;
    }

    /* ---------- TAB BAR ---------- */
    .tabbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 5px;
      margin-bottom: 26px;
      overflow-x: auto;
      padding-bottom: 4px;
      padding-top: 20px;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .05em;
      padding: 6px 8px;
      border-radius: 20px;
      border: 1.5px solid var(--text-dim);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .18s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab-pill:hover {
      transform: translateY(-1px);
    }

    .tab-pill .badge {
      background: var(--text-dim);
      color: #fff;
      border-radius: 8px;
      padding: 1px 6px;
      font-size: .64rem;
    }

    .tab-pill.active {
      background: var(--pill-c, var(--accent));
      color: #fff;
      border-color: var(--pill-c, var(--accent));
      box-shadow: 0 6px 16px -4px var(--pill-c, var(--accent));
    }

    .tab-pill.active .badge {
      background: rgba(255, 255, 255, 0.28);
      color: #fff;
    }

    .tab-pill.completed {
      border-color: #22c55e;
      color: #22c55e;
    }
    .tab-pill.completed .check-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
    }
    .tab-pill.active.completed {
      border-color: var(--pill-c, var(--accent));
      color: #fff;
    }
    .tab-pill.active.completed .check-icon {
      background: rgba(255,255,255,0.35);
    }

    /* ---------- SECTION ---------- */
    .section-block {
      margin: 26px 0 0;
    }

    .section-title {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
      padding-left: 16px;
      position: relative;
      margin-bottom: 10px;
      margin-top: 50px;
    }

    .section-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

      .section-caption {
        width: 100%;
        display: block;
        text-align: center !important;
        margin: 0 auto 4px auto !important;
        padding: 0 !important;
        font-family: var(--font-serif);
        font-size: 0.8rem;
        font-weight: 200;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    .step-meta {
      font-family: var(--font-mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      row-gap: 6px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .step-meta .prog {
      font-family: var(--font-mono);
      color: var(--text-mute);
      font-weight: 500;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    /* ---------- GRID / CARDS ---------- */
    .grid {
      display: grid;
      gap: 14px;
    }

    /* Fluid card grids: keep the target column count on wide desktops but
       reflow to fewer columns as the viewport narrows, without hard breakpoints. */
    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    @media(max-width:900px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .app {
        padding: 18px 24px 50px;
      }

      .topbar {
        flex-wrap: wrap;
        gap: 12px;
      }

      .topbar-center {
        order: 3;
        flex-basis: 100%;
        margin: 8px 0 0;
      }

      .topbar-title {
        font-size: 1.4rem;
      }

      .tabbar {
        gap: 6px;
        padding-top: 20px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        margin-left: -24px;
        margin-right: -24px;
        padding-left: 24px;
        padding-right: 24px;
      }

      .tabbar::-webkit-scrollbar {
        display: none;
      }

      .kpi-value {
        font-size: 1.5rem;
      }

      .section-title {
        font-size: 1.25rem;
        margin-top: 32px;
      }

      .headline {
        font-size: 1.6rem;
      }
    }

    @media(max-width:620px) {

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 14px 14px 40px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding-bottom: 14px;
      }

      .topbar-center {
        align-items: flex-start;
        text-align: left;
      }

      .topbar-title {
        font-size: 1.15rem;
      }

      .topbar-desc {
        font-size: 0.75rem;
      }

      .brand-name {
        font-size: .7rem;
      }

      .brand-sub {
        font-size: .62rem;
      }

      .tabbar {
        gap: 5px;
        padding-top: 16px;
        margin-left: -14px;
        margin-right: -14px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .tab-pill {
        font-size: .62rem;
        padding: 5px 7px;
      }

      .headline {
        font-size: 1.3rem;
        margin: 8px 0 6px;
      }

      .sub-headline {
        font-size: .82rem;
      }

      .section-title {
        font-size: 1.1rem;
        margin-top: 24px;
        padding-left: 12px;
      }

      .kpi-value {
        font-size: 1.3rem;
      }

      .kpi-label {
        font-size: .6rem;
      }

      .card {
        padding: 14px 14px;
      }

      .row-card {
        padding: 12px 14px;
        gap: 10px;
      }

      .btn {
        font-size: .72rem;
        padding: 10px 16px;
        width: 100%;
        text-align: center;
      }

      .radio-opt {
        font-size: .7rem;
        padding: 7px 12px;
      }

      .check-chip {
        font-size: .66rem;
        padding: 5px 10px;
      }

      .step-meta {
        font-size: .6rem;
      }

      select,
      input[type="text"],
      input[type="number"] {
        font-size: .82rem;
        padding: 9px 10px;
      }

      .field-label {
        font-size: .62rem;
      }

      thead th {
        font-size: .58rem;
        padding: 9px 10px;
      }

      tbody td {
        font-size: .76rem;
        padding: 9px 10px;
      }

      .topbar-desc {
        display: none;
      }

      .nav-row {
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-row .btn {
        flex: 1;
        min-width: 0;
      }

      .nav-row .spacer {
        display: none;
      }

      .chart-box {
        padding: 12px 10px 6px;
        overflow-x: auto;
      }
    }

    /* Enable horizontal scroll on tables for small screens */
    @media(max-width:768px) {
      .table-wrap {
        overflow: visible;
      }

      .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        min-width: 600px;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(225, 38, 28, 0.35);
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-family: var(--font-mono);
      color: var(--text-mute);
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 1.9rem;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .kpi-delta {
      font-family: var(--font-mono);
      font-size: .74rem;
      font-weight: 700;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .kpi-delta.pos {
      color: var(--green);
    }

    .kpi-delta.neg {
      color: var(--accent);
    }

    .card-body-text {
      font-size: .83rem;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* numbered story-style row card (used for lists) */
    .row-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      background: var(--surface);
      margin-bottom: 10px;
      transition: .2s;
    }

    .row-card:hover {
      border-color: rgba(225, 38, 28, 0.3);
      box-shadow: var(--shadow);
    }

    .row-num {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text-mute);
      font-size: .9rem;
      padding-top: 2px;
      width: 20px;
      flex: 0 0 20px;
    }

    .row-content {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.05rem;
      margin: 4px 0 4px;
    }

    .row-sub {
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--text-mute);
      letter-spacing: .06em;
      text-transform: uppercase;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ---------- TAGS / PILLS ---------- */
    .tag {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .tag-red {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(225, 38, 28, 0.3);
    }

    .tag-green {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(30, 158, 90, 0.3);
    }

    .tag-gold {
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid rgba(185, 134, 31, 0.3);
    }

    .tag-blue {
      background: var(--blue-soft);
      color: var(--blue);
      border: 1px solid rgba(42, 99, 199, 0.3);
    }

    .tag-grey {
      background: var(--chip-bg);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* ---------- FORM CONTROLS ---------- */
    .field {
      margin-bottom: 16px;
    }

    .field-label {
      font-family: var(--font-mono);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: block;
    }

    /* ---------- CUSTOM AUTOCOMPLETE ---------- */
    .autocomplete-wrap {
      position: relative;
      width: 100%;
    }

    .autocomplete-wrap input {
      width: 100%;
      box-sizing: border-box;
    }

    .autocomplete-list {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius-m);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.14);
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .autocomplete-list.open {
      display: block;
    }

    .autocomplete-item {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--text);
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .autocomplete-item .ac-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .autocomplete-item strong {
      font-weight: 600;
      color: var(--accent);
    }

    .ac-no-result {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--text-mute);
      padding: 14px 16px;
      text-align: center;
    }


    select,
    input[type="text"],
    input[type="number"],
    input[type="file"] {
      color-scheme: inherit;
      font-family: var(--font-sans);
      font-size: .9rem;
      background: var(--surface);
      color: var(--text);
      border: 2.5px solid var(--border-strong);
