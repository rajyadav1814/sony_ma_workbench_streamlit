<script>
    /* Step loader: a translucent overlay on the step content only (#screenRoot).
       The header, step tabs and title stay visible. Used by the workbench while it
       asks Streamlit to rerun, and by the loader shell shown during the reload. */
    function wbMountStepLoader(label) {
      var root = document.getElementById("screenRoot");
      if (!root) return null;
      wbRemoveStepLoader();
      if (!document.getElementById("wb-step-loader-style")) {
        var style = document.createElement("style");
        style.id = "wb-step-loader-style";
        style.textContent =
          "#wb-step-loader{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding-top:72px;" +
          "background:color-mix(in srgb,var(--bg,#F1EFE7) 55%,transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}" +
          "#wb-step-loader .wb-step-loader__card{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:280px;padding:32px 42px;" +
          "background:var(--surface,#fff);color:var(--text,#141210);border:1px solid rgba(20,18,14,.12);border-radius:14px;" +
          "box-shadow:0 14px 34px rgba(20,18,14,.14);font:600 15px Inter,Arial,sans-serif;}" +
          "#wb-step-loader .wb-step-loader__spinner{width:34px;height:34px;border:4px solid #E5E1D8;border-top-color:#E1261C;border-radius:50%;animation:wb-step-spin .8s linear infinite;}" +
          "@keyframes wb-step-spin{to{transform:rotate(360deg)}}" +
          "@keyframes wb-step-in{from{opacity:0}}" +
          "#wb-step-loader{animation:wb-step-in .18s ease both;}" +
          "@media (prefers-reduced-motion:reduce){#wb-step-loader{animation:none}#wb-step-loader .wb-step-loader__spinner{animation-duration:2.4s}}";
        document.head.appendChild(style);
      }
      root.style.position = "relative";
      root.style.minHeight = "280px";
      var overlay = document.createElement("div");
      overlay.id = "wb-step-loader";
      overlay.setAttribute("role", "status");
      overlay.setAttribute("aria-live", "polite");
      overlay.innerHTML = '<div class="wb-step-loader__card"><div class="wb-step-loader__spinner" aria-hidden="true"></div><div class="wb-step-loader__title"></div></div>';
      overlay.querySelector(".wb-step-loader__title").textContent = label || "Processing…";
      root.appendChild(overlay);
      return overlay;
    }
    function wbRemoveStepLoader() {
      var existing = document.getElementById("wb-step-loader");
      if (existing) existing.remove();
    }
</script>
